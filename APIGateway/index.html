<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 900px;">
        
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-primary">Catalogo Sport</h1>
        </header>

        <div class="row g-2 justify-content-center bg-white p-3 rounded shadow-sm mb-4">
            <div class="col-auto">
                <input type="text" id="username" class="form-control" placeholder="Username (admin)">
            </div>
            <div class="col-auto">
                <input type="password" id="password" class="form-control" placeholder="Password (password123)">
            </div>
            <div class="col-auto">
                <button class="btn btn-dark fw-bold" onclick="eseguiLogin()">Login</button>
            </div>
        </div>
        
        <div class="row g-2 justify-content-center bg-white p-3 rounded shadow-sm mb-4">
            <div class="col-auto">
                <button class="btn btn-primary fw-bold" onclick="caricaDati('tutti')">Tutti gli Sport</button>
            </div>
            <div class="col-auto">
                <button class="btn btn-success fw-bold" onclick="caricaDati('squadra')">Sport di Squadra</button>
            </div>
            <div class="col-auto">
                <button class="btn btn-warning fw-bold text-dark" onclick="caricaDati('moderni')">Sport Moderni (post-1900)</button>
            </div>
            <div class="col-auto">
                <button class="btn btn-danger fw-bold" onclick="caricaDati('inesistente')">Test Errore 404</button>
            </div>
        </div>
        
        <div id="controlli" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
            <div class="col-12 d-flex justify-content-center align-items-center py-4 text-muted w-100">
                <p class="fs-5 text-center m-0">Clicca su un pulsante per interrogare il Web Service REST.</p>
            </div>
        </div>

        <div id="controlli-pagine" class="row mt-4 pt-3 border-top" style="display: none;"></div>

    </div>
    
    <script src="java.js"></script>
</body>
</html>
